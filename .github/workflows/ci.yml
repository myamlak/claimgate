name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            configure: -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
          - name: linux-clang
            os: ubuntu-latest
            configure: -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          - name: macos-clang
            os: macos-latest
            configure: -DCMAKE_BUILD_TYPE=Release
          - name: windows-msvc
            os: windows-latest
            configure: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix install
